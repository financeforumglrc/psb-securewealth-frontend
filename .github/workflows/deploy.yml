name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_surge: ${{ steps.check.outputs.has_surge }}
    steps:
      - name: Check Surge secrets
        id: check
        run: |
          if [ -n "${{ secrets.SURGE_LOGIN }}" ] && [ -n "${{ secrets.SURGE_TOKEN }}" ]; then
            echo "has_surge=true" >> $GITHUB_OUTPUT
          else
            echo "has_surge=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_surge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/200.html

      - name: Deploy to Surge
        run: npx surge --project ./dist --domain psb-securewealth-2026-new.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
