name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build web app
        run: |
          cd client
          npm run build

      - name: Package mobile OTA bundle
        run: |
          cd client
          node scripts/package-mobile-bundle.cjs

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: psb-securewealth-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: PSB SecureWealth Twin - Latest APK
          body: |
            Latest debug APK built automatically from the main branch.
            Download `app-debug.apk` below and install it on your Android device.
          prerelease: true
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
